(function(){
 'use strict';
 const K='iflab_local_demo_v3';
 const levels=['zero','first','second','third','mixed'];
 let db;
 try{db=JSON.parse(localStorage.getItem(K))||{students:[],attempts:[],passes:[]};}catch(e){db={students:[],attempts:[],passes:[]};}
 const save=()=>localStorage.setItem(K,JSON.stringify(db));
 const uid=()=>String(Date.now())+Math.random().toString(36).slice(2);
 const mix=xs=>{let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const student=t=>{let s=db.students.find(x=>x.token===t);if(!s)throw new Error('Sesión desconocida. Vuelve a entrar.');return s};
 const original=(lv,id)=>window.__IF_DEMO_BANK[lv].find(q=>q.id===id);
 const getAttempt=(s,id)=>{let a=db.attempts.find(x=>x.id===id&&x.studentId===s.id);if(!a)throw new Error('Intento no encontrado');return a};
 const pack=a=>({id:a.id,level:a.level,mode:a.mode,violations:a.violations,answered:Object.keys(a.answers).length,questions:a.items.map(it=>({id:it.id,question:original(a.level,it.id).q,options:it.options}))});
 window.IF_DEMO={
  loginStudent(name,group,pin){name=String(name||'').trim();group=String(group||'').trim();pin=String(pin||'').trim();if(name.length<4||group.length<2||!/^[0-9]{6}$/.test(pin))throw new Error('Ingresa nombre, grupo y clave de 6 números.');let s=db.students.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.group.toLowerCase()===group.toLowerCase());if(s&&s.pin!==pin)throw new Error('La clave no coincide.');if(!s){s={id:uid(),name,group,pin,token:uid()};db.students.push(s)}else s.token=uid();save();return {token:s.token}},
  getStudentState(token){let s=student(token),passed={},attempts=[];for(let p of db.passes.filter(x=>x.studentId===s.id))passed[p.level]={score:p.score,date:p.date,times:p.times};attempts=db.attempts.filter(x=>x.studentId===s.id&&x.status!=='active').slice(-30).reverse().map(x=>({level:x.level,mode:x.mode,status:x.status,score:x.score,date:x.finishedAt,violations:x.violations}));return {student:{name:s.name,group:s.group},passed,attempts}},
  startAttempt(token,level,mode){let s=student(token),i=levels.indexOf(level);if(i<0||!['exam','practice'].includes(mode))throw new Error('Actividad inválida.');if(i>0&&!db.passes.some(x=>x.studentId===s.id&&x.level===levels[i-1]))throw new Error('Primero aprueba el examen del nivel anterior.');let prev=db.attempts.find(x=>x.studentId===s.id&&x.level===level&&x.mode===mode&&x.status==='active');if(prev)return pack(prev);
   let items=mix(window.__IF_DEMO_BANK[level]).slice(0,20).map(q=>({id:q.id,options:mix(q.options)}));let a={id:uid(),studentId:s.id,level,mode,items,answers:{},violations:0,status:'active',score:0};db.attempts.push(a);save();return pack(a)},
  checkPractice(token,id,index,choice){let s=student(token),a=getAttempt(s,id);if(a.status!=='active'||a.mode!=='practice')throw new Error('Práctica finalizada');index=Number(index);choice=Number(choice);if(index!==Object.keys(a.answers).length)throw new Error('Pregunta fuera de orden');let it=a.items[index],q=original(a.level,it.id),correct=it.options.indexOf(q.options[0]);a.answers[index]=choice;let points=Object.keys(a.answers).reduce((sum,i)=>sum+(a.items[i].options[a.answers[i]]===original(a.level,a.items[i].id).options[0]?1:0),0);let done=Object.keys(a.answers).length===20;if(done){a.status='completed';a.score=points;}save();return {correct:choice===correct,correctIndex:correct,explanation:q.why,done,points,total:20}},
  reportViolation(token,id,count){let s=student(token),a=getAttempt(s,id);if(a.mode!=='exam')throw new Error('No es un examen');if(a.status!=='active')return {status:a.status,violations:a.violations};a.violations=Math.max(a.violations,Number(count)||0);if(a.violations>=3)a.status='annulled';save();return {status:a.status,violations:a.violations}},
  finishExam(token,id,answers,count){let s=student(token),a=getAttempt(s,id);if(a.status!=='active'||a.mode!=='exam')throw new Error('Examen ya finalizado');if(!Array.isArray(answers)||answers.length!==20)throw new Error('Entrega incorrecta');a.violations=Math.max(a.violations,Number(count)||0);let annulled=a.violations>=3,right=annulled?0:a.items.reduce((sum,it,i)=>sum+(it.options[answers[i]]===original(a.level,it.id).options[0]?1:0),0);a.score=right*5;a.answers=answers;a.status=annulled?'annulled':'completed';a.finishedAt=new Date().toISOString();let passed=!annulled&&a.score>=80;if(passed){let p=db.passes.find(x=>x.studentId===s.id&&x.level===a.level);if(p){p.score=Math.max(p.score,a.score);p.times++;p.date=a.finishedAt;}else db.passes.push({studentId:s.id,level:a.level,score:a.score,date:a.finishedAt,times:1});}save();return {status:a.status,score:a.score,passed,correct:right,total:20,notification:'demo'}},
  teacherReport(password){if(password!=='docente123')throw new Error('En la demo, la clave es docente123.');let achievements=db.passes.map(p=>{let s=db.students.find(x=>x.id===p.studentId);return {name:s?.name||'—',group:s?.group||'—',level:p.level,score:p.score,date:p.date,times:p.times}}).reverse();return {students:db.students.length,passes:achievements.length,exams:db.attempts.filter(a=>a.mode==='exam'&&a.status!=='active').length,achievements,notificationsFailed:0}}
 };
})();

 {id:'zero',n:1,name:'Zero conditional',subtitle:'Hechos y verdades generales',icon:'🌍',tag:'El mundo real',formula:'If + present simple, present simple',description:'Usamos este condicional para hechos científicos, hábitos y situaciones que se repiten. Si ocurre A, normalmente ocurre B.',situations:['Hechos de la naturaleza','Hábitos y rutinas','Instrucciones generales'],examples:[['If you heat ice, it melts.','Si calientas hielo, se derrite.'],['If I am tired, I go to bed early.','Si estoy cansado, me acuesto temprano.'],['When it rains, the streets get wet.','Cuando llueve, las calles se mojan.']],errors:['❌ If you will heat ice, it melts.','✅ If you heat ice, it melts.'],tips:'“If” puede cambiarse por “when” cuando hablas de un hecho que se repite.'},

 {id:'second',n:3,name:'Second conditional',subtitle:'Situaciones imaginarias',icon:'💭',tag:'Imagina que...',formula:'If + past simple, would + base verb',description:'Se usa para situaciones irreales o poco probables en el presente o futuro, y también para dar consejos.',situations:['Sueños e imaginación','Hipótesis poco probables','Consejos: If I were you...'],examples:[['If I had wings, I would fly.','Si tuviera alas, volaría.'],['If I were you, I would practice.','Si yo fuera tú, practicaría.'],['If she knew the answer, she would tell us.','Si supiera la respuesta, nos la diría.']],errors:['❌ If I would have time, I would travel.','✅ If I had time, I would travel.'],tips:'En contextos formales e hipotéticos se recomienda “If I were...” y “If she were...”.'},

 {id:'mixed',n:5,name:'Mixed conditionals',subtitle:'Dos tiempos en una historia',icon:'🪄',tag:'Conecta el tiempo',formula:'If + past perfect → would + base verb (now)',description:'Conectamos una causa imaginaria con un resultado de otro momento. La mezcla más común es pasado → presente, aunque también existe presente → pasado.',situations:['Pasado irreal → resultado actual','Situación actual hipotética → pasado diferente','Interpretación de pistas de tiempo'],examples:[['If I had slept earlier, I would feel better now.','Si hubiera dormido antes, ahora me sentiría mejor.'],['If she had learned English, she would speak it now.','Si hubiera aprendido inglés, ahora lo hablaría.'],['If I were more organized, I would have finished yesterday.','Si fuera más organizado, habría terminado ayer.']],errors:['❌ If I had slept, I would have felt better now. (no expresa con claridad el resultado presente)','✅ If I had slept, I would feel better now.'],tips:'Otra fórmula válida es If + past simple → would have + participio, para una condición presente que afectó al pasado.'}

let S={token:localStorage.getItem('iflab_token')||'',profile:null,view:'home',level:'zero',attempt:null,index:0,answers:[],feedback:null,examWarning:false,violations:0,adminData:null,error:'',busy:false,modal:null,armed:false,focusStarted:0,incidentAt:0};
const escapeHtml=(s)=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>LEVELS.find(x=>x.id===S.level)||LEVELS[0];
const passed=(id)=>Boolean(S.profile?.passed?.[id]);
const unlocked=(id)=>{let i=LEVELS.findIndex(x=>x.id===id);return i<=0||passed(LEVELS[i-1].id)};
const nextUnlocked=()=>LEVELS.find(x=>unlocked(x.id)&&!passed(x.id))?.id||LEVELS[LEVELS.length-1].id;
const levelName=(id)=>LEVELS.find(x=>x.id===id)?.name||id;
const toast=(msg)=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(window.__ifToast);window.__ifToast=setTimeout(()=>t.classList.add('hide'),3600)};
function api(method,...args){
  if(window.IF_DEMO) return Promise.resolve().then(()=>window.IF_DEMO[method](...args));
  return new Promise((resolve,reject)=>{
    if(typeof google==='undefined'||!google.script?.run){reject(new Error('Esta versión debe abrirse desde el enlace publicado de Google Apps Script.'));return;}
    google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err?.message||String(err))))[method](...args);
  });
}

if(S.modal==='incident')return `<div class="modal-back"><div class="modal" role="alertdialog" aria-modal="true"><h2>⚠️ Advertencia de examen</h2><p>La aplicación detectó que saliste o cambiaste de ventana durante la evaluación. <b>No se permite usar traductores ni otras pestañas.</b></p><div class="warning"><b>Incidencias registradas: ${S.violations} de 3</b><br>La tercera incidencia anula el intento automáticamente.</div><button class="btn btn-primary btn-wide" data-act="close-modal">Entendido, continuar</button></div></div>`;
if(S.modal==='leave')return `<div class="modal-back"><div class="modal"><h2>¿Deseas salir?</h2><p>Tu intento de examen permanecerá abierto, y podrás retomarlo desde esta cuenta. No es una entrega.</p><div class="btn-row"><button class="btn btn-outline" data-act="close-modal">Continuar examen</button><button class="btn btn-danger" data-act="confirm-leave">Salir sin entregar</button></div></div></div>`;
if(S.modal==='submit')return `<div class="modal-back"><div class="modal"><h2>🏁 Confirmar entrega</h2><p>Has respondido <b>${S.answers.filter(x=>x!==null).length} de 20</b> preguntas. Las no respondidas valdrán 0 puntos.</p><p>Una vez entregado, el examen se califica en el servidor y no puedes modificar este intento.</p><div class="btn-row"><button class="btn btn-outline" data-act="close-modal">Revisar respuestas</button><button class="btn btn-primary" data-act="submit-exam">Entregar para calificar</button></div></div></div>`;
return '';
}
function render(){if(!S.profile){loginHtml();return;}let content=S.view==='home'?homeHtml():S.view==='learn'?learnHtml():S.view==='choose'?chooseHtml():S.view==='session'?sessionHtml():S.view==='result'?resultHtml():S.view==='progress'?progressHtml():S.view==='teacher'?teacherHtml():homeHtml();shell(content);}
async function refresh(){S.profile=await api('getStudentState',S.token);}
async function login(data){S.error='';S.busy=true;render();try{let res=await api('loginStudent',data.get('name'),data.get('group'),data.get('pin'));S.token=res.token;localStorage.setItem('iflab_token',S.token);await refresh();S.level=nextUnlocked();S.view='home';}catch(e){S.error=e.message;S.token='';localStorage.removeItem('iflab_token');}finally{S.busy=false;render();}}
function ensureLevel(id){if(unlocked(id)){S.level=id;S.view='learn';S.modal=null;render();window.scrollTo(0,0)}else toast('Primero debes aprobar el nivel anterior con 80/100.');}
async function begin(mode){if(S.busy)return;S.busy=true;S.modal=null;render();try{
 let a=await api('startAttempt',S.token,S.level,mode);S.attempt=a;S.index=0;S.feedback=null;S.violations=a.violations||0;S.answers=Array(a.questions.length).fill(null);
 if(mode==='practice'){S.index=a.answered||0;if(S.index>=a.questions.length){toast('Esta práctica ya fue completada. Inicia otra.');S.attempt=null;S.view='choose';return;}}
 if(mode==='exam'){
  let restored=sessionStorage.getItem('iflab_exam_'+a.id);
  if(restored){try{let z=JSON.parse(restored);if(Array.isArray(z.answers)&&z.answers.length===20)S.answers=z.answers;S.violations=Math.max(S.violations,Number(z.violations)||0);S.index=Math.max(0,Math.min(19,Number(z.index)||0));}catch(e){}}
  S.focusStarted=Date.now()+1600;S.armed=true;
 }
 S.view='session';window.scrollTo(0,0);
 }catch(e){toast('No se pudo iniciar: '+e.message);}finally{S.busy=false;render();}}
function persistExam(){if(S.attempt?.mode==='exam')sessionStorage.setItem('iflab_exam_'+S.attempt.id,JSON.stringify({answers:S.answers,index:S.index,violations:S.violations}));}
function stopExam(){S.armed=false;S.focusStarted=0;}
async function doPractice(choice){if(S.busy||S.feedback)return;S.answers[S.index]=choice;S.busy=true;render();try{let f=await api('checkPractice',S.token,S.attempt.id,S.index,choice);S.feedback=f;}catch(e){S.answers[S.index]=null;toast('No se pudo comprobar: '+e.message)}finally{S.busy=false;render();}}
async function submitExam(){if(S.busy)return;S.busy=true;S.modal=null;stopExam();render();try{let r=await api('finishExam',S.token,S.attempt.id,S.answers,S.violations);sessionStorage.removeItem('iflab_exam_'+S.attempt.id);S.result={...r,mode:'exam'};S.attempt=null;await refresh();S.view='result';if(r.passed)launchConfetti();}catch(e){S.armed=true;S.focusStarted=Date.now()+1600;toast('No se pudo entregar: '+e.message);}finally{S.busy=false;render();window.scrollTo(0,0);}}
function launchConfetti(){let host=document.createElement('div');host.style.cssText='position:fixed;pointer-events:none;inset:0;z-index:100;overflow:hidden';let symbols=['✨','🎉','⭐','💜','🌟'];for(let i=0;i<24;i++){let el=document.createElement('span');el.textContent=symbols[i%symbols.length];el.style.cssText=`position:absolute;top:-30px;left:${Math.random()*100}%;font-size:${14+Math.random()*20}px;animation:fall ${1.7+Math.random()*2.1}s linear forwards;animation-delay:${Math.random()*.7}s;`;host.appendChild(el)}let style=document.createElement('style');style.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:.1}}';host.appendChild(style);document.body.appendChild(host);setTimeout(()=>host.remove(),4400)}
function incident(){if(!S.armed||!S.attempt||S.attempt.mode!=='exam'||S.view!=='session'||Date.now()<S.focusStarted)return;if(Date.now()-S.incidentAt<1800)return;
 S.incidentAt=Date.now();S.violations=Math.max(S.violations,0)+1;persistExam();
 let id=S.attempt.id;
 if(S.violations>=3){stopExam();S.modal=null;S.result={status:'annulled',passed:false,score:0,mode:'exam'};S.attempt=null;S.view='result';render();api('reportViolation',S.token,id,S.violations).catch(()=>toast('No fue posible sincronizar las incidencias.'));return;}
 S.modal='incident';render();api('reportViolation',S.token,id,S.violations).then(r=>{if(r?.status==='annulled'&&S.attempt?.id===id){stopExam();S.modal=null;S.result={status:'annulled',passed:false,score:0,mode:'exam'};S.attempt=null;S.view='result';render();}}).catch(()=>toast('Incidencia guardada localmente; se enviará al entregar.'));
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)incident()});window.addEventListener('blur',()=>incident());
document.addEventListener('keydown',e=>{if(S.armed&&S.attempt?.mode==='exam'&&(['c','v','p','t','n'].includes(e.key.toLowerCase())&&(e.ctrlKey||e.metaKey))){e.preventDefault();toast('Durante el examen no se permiten estas acciones.')}});
document.addEventListener('contextmenu',e=>{if(S.armed&&S.attempt?.mode==='exam')e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(S.armed&&S.attempt?.mode==='exam'){persistExam();e.preventDefault();e.returnValue='';}});
app.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='login-form')await login(f);if(e.target.id==='admin-form')try{S.adminData=await api('teacherReport',f.get('password'));render()}catch(err){toast(err.message)}});
app.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b||S.busy)return;let act=b.dataset.act;
 if(act==='nav'){if(S.view==='session'&&S.attempt?.mode==='exam'){S.modal='leave';render();return;}if(S.view==='session'){S.attempt=null;stopExam();}S.view=b.dataset.target;S.modal=null;render();window.scrollTo(0,0)}
 if(act==='open-level')ensureLevel(b.dataset.level);
 if(act==='exam-info'){S.modal='rules';render()}
 if(act==='close-modal'){S.modal=null;render()}
 if(act==='begin')await begin(b.dataset.mode);
 if(act==='answer'){
  let index=Number(b.dataset.choice);
  if(S.attempt?.mode==='exam'){S.answers[S.index]=index;persistExam();render()}
  else await doPractice(index);
 }
 if(act==='prev-question'&&S.index>0){S.index--;persistExam();render()}
 if(act==='next-question'){
  if(S.index>=19){S.modal='submit';render()}
  else {S.index++;persistExam();render();window.scrollTo({top:0,behavior:'smooth'})}
 }
 if(act==='next-practice'&&S.feedback){
  if(S.feedback.done){S.result={status:'completed',mode:'practice',score:S.feedback.points};S.attempt=null;S.feedback=null;S.view='result';await refresh();}
  else {S.index++;S.feedback=null;}render();window.scrollTo({top:0,behavior:'smooth'});
 }
 if(act==='submit-exam')await submitExam();
 if(act==='leave-attempt'){if(S.attempt?.mode==='exam'){S.modal='leave';render()}else{S.attempt=null;S.feedback=null;S.view='choose';render()}}
 if(act==='confirm-leave'){stopExam();persistExam();S.attempt=null;S.modal=null;S.view='choose';render()}
 if(act==='speak'){let sentence=current().examples[Number(b.dataset.example)]?.[0];if(!sentence)return;if(!('speechSynthesis' in window)){toast('Tu navegador no admite lectura de voz.');return;}speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(sentence);utter.lang='en-US';utter.rate=.83;speechSynthesis.speak(utter)}
 if(act==='export'&&S.adminData){let rows=[['Estudiante','Grupo','Nivel','Mejor nota','Aprobaciones','Fecha'],...S.adminData.achievements.map(a=>[a.name,a.group,levelName(a.level),a.score,a.times,a.date])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='iflab_aprobaciones.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
});
async function init(){if(S.token){try{await refresh();S.level=nextUnlocked();S.view='home';}catch(e){S.token='';localStorage.removeItem('iflab_token');S.profile=null;S.error='Ingresa nuevamente para continuar.'}}render()}
init();
})();
</script>
</body>
</html>
